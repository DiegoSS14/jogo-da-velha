<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha - Autenticação</title>
    <!-- CDN do Tailwind CSS mantendo os mesmos padrões das suas classes do React -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'bg-custom': '#09090b', // tom escuro proporcional ao bg do seu React
              'accent': '#38bdf8',    // azul/cyan de destaque do seu botão
              'text-h': '#f4f4f5',
            }
          }
        }
      }
    </script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center p-6">

    <main class="relative flex flex-col items-center justify-center w-full max-w-md mx-auto">
        <section class="flex flex-col gap-8 justify-center items-center w-full bg-zinc-900/60 border border-zinc-800/80 p-8 rounded-xl backdrop-blur-sm shadow-2xl">
            
            <div class="flex flex-col items-center gap-2 text-center">
                <h1 class="text-4xl font-bold text-text-h tracking-tight">Jogo da Velha</h1>
                <p class="text-sm text-zinc-400">Faça login e comece a jogar!</p>
            </div>

            <!-- Alerta em caso de erro na autenticação -->
            <div th:if="${param.error}" class="w-full bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-lg text-sm text-center">
                Usuário ou senha incorretos. Tente novamente.
            </div>

            <!-- Alerta em caso de logout efetuado -->
            <div th:if="${param.logout}" class="w-full bg-blue-500/10 border border-blue-500/30 text-blue-300 px-4 py-3 rounded-lg text-sm text-center">
                Você foi desconectado com sucesso.
            </div>

            <!-- Formulário apontando para o endpoint do Spring Security -->
            <form th:action="@{/login}" method="post" class="flex flex-col gap-4 justify-center items-center w-full">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                
                <div class="w-full flex flex-col gap-3">
                    <div class="flex flex-col gap-1">
                        <label for="username" class="text-xs text-zinc-400 font-medium ml-1">Usuário</label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            required
                            placeholder="Digite seu usuário"
                            class="bg-zinc-800/40 px-3 py-2 rounded-lg text-white transition-all"
                        />
                    </div>

                    <div class="flex flex-col gap-1">
                        <label for="password" class="text-xs text-zinc-400 font-medium ml-1">Senha</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            placeholder="••••••••"
                            class="bg-zinc-800/40 px-3 py-2 rounded-lg text-white transition-all"
                        />
                    </div>
                </div>

                <button
                    type="submit"
                    class="w-full bg-purple-500 px-3 py-2 rounded-lg text-white/90 font-medium cursor-pointer"
                >
                    Entrar
                </button>
            </form>
        </section>
    </main>

</body>
</html>
